<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Library</title>
</head>
<body>

  <!-- 1. Button to open the modal -->
  <button id="new-book-btn">+ New Book</button>

  <!-- 2. The hidden modal containing the form -->
  <dialog id="book-dialog">
    <form id="book-form">
      <h2>Add a New Book</h2>
      
      <label for="title">Title:</label>
      <input type="text" id="title" required>

      <label for="author">Author:</label>
      <input type="text" id="author" required>

      <label for="pages">Pages:</label>
      <input type="number" id="pages" required>

      <label for="read">
        <input type="checkbox" id="read"> Have you read it?
      </label>

      <div>
        <button type="button" id="cancel-btn">Cancel</button>
        <button type="submit">Add Book</button>
      </div>
    </form>
  </dialog>

  <!-- 3. Empty container where JS will inject the book cards -->
  <div id="library-container"></div>

  <script src="script.js"></script>
</body>
</html>
